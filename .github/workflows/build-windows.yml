name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BasketVideoCutter basket_video_cutter.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BasketVideoCutter-Windows
          path: dist/BasketVideoCutter.exe
